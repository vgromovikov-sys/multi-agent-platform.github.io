document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fstyle>\n<style>\nhtml,body{margin:0;height:100%;background:#1d1d1b;font-family:'Golos Text',system-ui,sans-serif;color:#1d1d1b;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#c2571c}a:hover{color:#1d1d1b}\ninput[type=range]{accent-color:#c2571c}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"6661c64e-02cd-4a87-ba1e-ff30dbc72997#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Титул\" data-screen-label=\"01 Титул\" data-speaker-notes=\"Представить проект и цель заседания: получить решение по FID.\" style=\"background:#1d1d1b;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:120px 140px\">\n<div style=\"display:flex;align-items:center;gap:18px;font-size:28px;color:#b8b8b2\"><span style=\"width:44px;height:44px;border-radius:12px;background:#c2571c;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px\">К<\u002Fspan>Инвестиционный комитет · ноябрь 2026<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:36px\">\n<div style=\"font:500 26px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">ПРОЕКТ ЛУ «СЕВЕРНЫЙ»<\u002Fdiv>\n<h1 style=\"margin:0;font-size:128px;font-weight:600;line-height:1.02;letter-spacing:-.025em;max-width:1500px;text-wrap:balance\">Ввод в разработку и решение FID<\u002Fh1>\n<p style=\"margin:0;font-size:36px;color:#b8b8b2;max-width:1200px;line-height:1.4\">Обоснование инвестиций на основе технико-экономической модели v3, горизонт 2027–2045 гг.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:80px;font-size:26px;color:#8a8a84;border-top:1px solid #3a3a37;padding-top:36px\"><span>Дирекция по разведке и добыче<\u002Fspan><span>Блок экономики и планирования<\u002Fspan><span style=\"margin-left:auto\">Конфиденциально<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Контекст\" data-screen-label=\"02 Контекст\" data-speaker-notes=\"Три аргумента в пользу проекта и чёткий запрос к комитету.\" style=\"background:#faf9f7;color:#1d1d1b;padding:110px 140px;display:flex;flex-direction:column;gap:64px\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">01 · ЦЕЛИ И КОНТЕКСТ<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">Зачем проект нужен компании<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:32px;flex:1\">\n<div style=\"background:#fff;border:1px solid #ececea;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:24px\"><div style=\"font-size:88px;font-weight:600;letter-spacing:-.02em\">18%<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;color:#3a3a37\">компенсация естественного падения добычи в регионе к 2030 г.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #ececea;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:24px\"><div style=\"font-size:88px;font-weight:600;letter-spacing:-.02em\">48 млн т<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;color:#3a3a37\">извлекаемые запасы категории 2P, подтверждены аудитом 2026 г.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #ececea;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:24px\"><div style=\"font-size:88px;font-weight:600;letter-spacing:-.02em\">НДД<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;color:#3a3a37\">налоговый режим повышает устойчивость к низким ценам<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#1d1d1b;color:#fff;border-radius:24px;padding:40px 48px;display:flex;align-items:center;gap:32px;font-size:34px\"><span style=\"color:#c2571c;font-weight:600\">Запрос<\u002Fspan>Утвердить FID и CAPEX первого этапа — 86,4 млрд руб.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Профиль добычи\" data-screen-label=\"03 Профиль добычи\" data-speaker-notes=\"Наведите на столбцы — показывается добыча по годам. Полка 2030–2034.\" style=\"background:#fff;color:#1d1d1b;padding:110px 140px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;align-items:flex-end;gap:40px\"><div style=\"display:flex;flex-direction:column;gap:20px;flex:1\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">02 · РЕСУРСНАЯ БАЗА<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">Профиль добычи нефти<\u002Fh2><\u002Fdiv>\n<div style=\"text-align:right;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:28px;color:#8a8a84\">{{ prodLabel }}<\u002Fspan><span style=\"font-size:64px;font-weight:600;letter-spacing:-.02em\">{{ prodValue }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div sc-camel-on-mouse-leave=\"{{ prodLeave }}\" style=\"flex:1;display:flex;align-items:flex-end;gap:14px;border-bottom:2px solid #1d1d1b;padding-top:20px\">\n<sc-for list=\"{{ prod }}\" as=\"p\" hint-placeholder-count=\"19\"><div sc-camel-on-mouse-enter=\"{{ p.enter }}\" style=\"flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:default\"><div style=\"height:{{ p.h }}%;background:{{ p.bg }};border-radius:8px 8px 0 0;transition:background .15s\"><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:14px;font:24px 'JetBrains Mono',monospace;color:#8a8a84;margin-top:-28px\">\n<sc-for list=\"{{ prod }}\" as=\"p\"><span style=\"flex:1;text-align:center\">{{ p.yl }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:64px;font-size:28px;color:#3a3a37\"><span><b>3,2 млн т/год<\u002Fb> — полка 2030–2034<\u002Fspan><span><b>214<\u002Fb> добывающих скважин<\u002Fspan><span><b>41,6 млн т<\u002Fb> накопленная добыча<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"CAPEX и OPEX\" data-screen-label=\"04 CAPEX и OPEX\" data-speaker-notes=\"Структура затрат. Бурение — главная статья, её фиксируем контрактами.\" style=\"background:#faf9f7;color:#1d1d1b;padding:110px 140px;display:grid;grid-template-columns:1.3fr 1fr;gap:96px\">\n<div style=\"display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">03 · ЗАТРАТЫ<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">CAPEX первого этапа<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:30px\">\n<sc-for list=\"{{ capex }}\" as=\"c\"><div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;font-size:32px\"><span style=\"flex:1\">{{ c.name }}<\u002Fspan><b>{{ c.v }}<\u002Fb><\u002Fdiv><div style=\"height:16px;background:#ececea;border-radius:8px\"><div style=\"height:100%;width:{{ c.w }}%;background:{{ c.color }};border-radius:8px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:32px;justify-content:center\">\n<div style=\"background:#fff;border:1px solid #ececea;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:12px\"><span style=\"font-size:28px;color:#8a8a84\">CAPEX всего, 2027–2045<\u002Fspan><span style=\"font-size:96px;font-weight:600;letter-spacing:-.02em\">142 млрд<\u002Fspan><span style=\"font-size:28px;color:#8a8a84\">руб., из них 1 этап — 86,4<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #ececea;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:12px\"><span style=\"font-size:28px;color:#8a8a84\">Удельный OPEX на полке<\u002Fspan><span style=\"font-size:96px;font-weight:600;letter-spacing:-.02em\">1 940<\u002Fspan><span style=\"font-size:28px;color:#8a8a84\">руб./т — на 12% ниже среднего по портфелю<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Экономика\" data-screen-label=\"05 Экономика\" data-speaker-notes=\"Интерактив: переключите сценарий и подвиньте ползунок CAPEX прямо на заседании.\" style=\"background:#1d1d1b;color:#fff;padding:110px 140px;display:flex;flex-direction:column;gap:56px\">\n<div style=\"display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;gap:20px;flex:1\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">04 · ЭКОНОМИКА<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">NPV, IRR и окупаемость<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;gap:6px;background:#2c2c2a;border-radius:18px;padding:6px\">\n<sc-for list=\"{{ scen }}\" as=\"s\"><button sc-camel-on-click=\"{{ s.onClick }}\" style=\"height:72px;padding:0 36px;border:0;border-radius:14px;background:{{ s.bg }};color:{{ s.color }};font:500 28px 'Golos Text',sans-serif;cursor:pointer\">{{ s.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:28px\">\n<sc-for list=\"{{ kpis }}\" as=\"k\"><div style=\"background:#2c2c2a;border-radius:24px;padding:44px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-size:28px;color:#b8b8b2\">{{ k.label }}<\u002Fspan><span style=\"font-size:80px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fspan><span style=\"font-size:24px;color:#8a8a84\">{{ k.sub }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:#2c2c2a;border-radius:24px;padding:44px;display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;align-items:baseline;gap:24px;font-size:30px\"><span style=\"flex:1\">Чувствительность к росту CAPEX<\u002Fspan><span style=\"font:600 40px 'JetBrains Mono',monospace;color:#c2571c\">{{ capexLabel }}<\u002Fspan><\u002Fdiv>\n<input type=\"range\" min=\"0\" max=\"80\" step=\"5\" value=\"{{ capexD }}\" sc-camel-on-change=\"{{ onCapex }}\" style=\"width:100%;height:28px\">\n<div style=\"display:flex;font-size:26px;color:#8a8a84\"><span style=\"flex:1\">0%<\u002Fspan><span>{{ capexNote }}<\u002Fspan><span style=\"flex:1;text-align:right\">+80%<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Риски\" data-screen-label=\"06 Риски\" data-speaker-notes=\"Ключевые риски и меры. Нажмите на строку, чтобы раскрыть меру.\" style=\"background:#fff;color:#1d1d1b;padding:110px 140px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">05 · РИСКИ<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">Риски и меры реагирования<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;border-top:2px solid #1d1d1b\">\n<sc-for list=\"{{ risks }}\" as=\"r\"><div sc-camel-on-click=\"{{ r.toggle }}\" style=\"display:flex;flex-direction:column;gap:16px;padding:32px 0;border-bottom:1px solid #ececea;cursor:pointer\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 220px 340px 48px;gap:32px;align-items:center;font-size:34px\"><span style=\"font-weight:500\">{{ r.name }}<\u002Fspan><span style=\"font-size:26px;padding:8px 18px;border-radius:10px;background:{{ r.lvlBg }};color:{{ r.lvlFg }};justify-self:start\">{{ r.lvl }}<\u002Fspan><span style=\"color:#55554f;font-size:30px\">{{ r.impact }}<\u002Fspan><span style=\"font-size:40px;color:#8a8a84;text-align:center\">{{ r.sign }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ r.open }}\"><div style=\"font-size:30px;color:#3a3a37;line-height:1.45;padding-left:0;max-width:1300px\"><span style=\"color:#c2571c;font-weight:600\">Мера: <\u002Fspan>{{ r.action }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Дорожная карта\" data-screen-label=\"07 Дорожная карта\" data-speaker-notes=\"Ключевые вехи после принятия решения.\" style=\"background:#faf9f7;color:#1d1d1b;padding:110px 140px;display:flex;flex-direction:column;gap:80px\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#c2571c;letter-spacing:.08em\">06 · РЕАЛИЗАЦИЯ<\u002Fdiv><h2 style=\"margin:0;font-size:72px;font-weight:600;letter-spacing:-.02em\">Дорожная карта<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:24px;position:relative;flex:1;align-content:start\">\n<div style=\"position:absolute;left:0;right:0;top:22px;height:2px;background:#d9d9d4\"><\u002Fdiv>\n<sc-for list=\"{{ road }}\" as=\"m\"><div style=\"display:flex;flex-direction:column;gap:28px;position:relative\"><span style=\"width:46px;height:46px;border-radius:50%;background:{{ m.dot }};border:6px solid #faf9f7\"><\u002Fspan><span style=\"font:600 30px 'JetBrains Mono',monospace;color:#c2571c\">{{ m.date }}<\u002Fspan><span style=\"font-size:34px;font-weight:600;line-height:1.25\">{{ m.title }}<\u002Fspan><span style=\"font-size:26px;color:#55554f;line-height:1.4\">{{ m.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Решение\" data-screen-label=\"08 Решение\" data-speaker-notes=\"Зачитать проект решения и перейти к голосованию.\" style=\"background:#c2571c;color:#fff;padding:110px 140px;display:flex;flex-direction:column;gap:56px\">\n<div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"font:500 24px 'JetBrains Mono',monospace;color:#fff;letter-spacing:.08em\">07 · ПРОЕКТ РЕШЕНИЯ<\u002Fdiv><h2 style=\"margin:0;font-size:84px;font-weight:600;letter-spacing:-.02em\">Комитету предлагается<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0;flex:1\">\n<div style=\"display:grid;grid-template-columns:100px 1fr;gap:24px;padding:32px 0;border-top:1px solid rgba(255,255,255,.4);font-size:40px;line-height:1.35\"><span style=\"font-family:'JetBrains Mono',monospace\">01<\u002Fspan><span>Утвердить FID по проекту ЛУ «Северный» по базовому сценарию.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:100px 1fr;gap:24px;padding:32px 0;border-top:1px solid rgba(255,255,255,.4);font-size:40px;line-height:1.35\"><span style=\"font-family:'JetBrains Mono',monospace\">02<\u002Fspan><span>Одобрить CAPEX первого этапа 86,4 млрд руб. на 2027–2029 гг.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:100px 1fr;gap:24px;padding:32px 0;border-top:1px solid rgba(255,255,255,.4);font-size:40px;line-height:1.35\"><span style=\"font-family:'JetBrains Mono',monospace\">03<\u002Fspan><span>Поручить закупкам зафиксировать стоимость бурения на 2027–2028 гг.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:100px 1fr;gap:24px;padding:32px 0;border-top:1px solid rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.4);font-size:40px;line-height:1.35\"><span style=\"font-family:'JetBrains Mono',monospace\">04<\u002Fspan><span>Рассмотреть отчёт о ходе реализации на заседании II кв. 2027 г.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hov: null, sc: 'base', capexD: 0, open: { 0: true } };\n  renderVals() {\n    const s = this.state;\n    const yrs = [];\n    for (let y = 2027; y <= 2045; y++) {\n      let v = y === 2027 ? 0.4 : y === 2028 ? 1.3 : y === 2029 ? 2.4 : y <= 2034 ? 3.2 : 3.2 * Math.pow(0.87, y - 2034);\n      yrs.push({ y, v });\n    }\n    const prod = yrs.map((p, i) => ({\n      h: (p.v / 3.4 * 100).toFixed(1), yl: i % 2 === 0 ? String(p.y).slice(2) : '',\n      bg: s.hov === i ? '#c2571c' : p.y >= 2030 && p.y <= 2034 ? '#1d1d1b' : '#cfcfca',\n      enter: () => this.setState({ hov: i })\n    }));\n    const hp = s.hov !== null ? yrs[s.hov] : null;\n    const SC = {\n      cons: { label: 'Консервативный', price: 55, npv: 18420, irr: 14.2, pb: 7.8 },\n      base: { label: 'Базовый', price: 70, npv: 31760, irr: 19.6, pb: 5.9 },\n      opt: { label: 'Оптимистичный', price: 85, npv: 44980, irr: 24.1, pb: 4.7 }\n    };\n    const c = SC[s.sc], d = s.capexD;\n    const npv = c.npv - 415 * d, irr = c.irr - 0.13 * d, pb = c.pb + 0.045 * d;\n    const f = n => Math.round(n).toLocaleString('ru-RU'), f1 = n => n.toFixed(1).replace('.', ',');\n    const R = [\n      ['Рост стоимости бурения', 'Высокая', '−4,2 млрд руб. NPV', 'Долгосрочные контракты с фиксацией цены на 2027–2028 гг., резерв 7% в смете.'],\n      ['Задержка ввода инфраструктуры', 'Средняя', '−3,2 млрд руб. за год', 'Параллельное проектирование УПН и трубопровода, ранний заказ оборудования.'],\n      ['Подтверждаемость запасов', 'Средняя', '±11% профиля', 'Опережающее бурение 6 оценочных скважин, 3D-сейсмика на южном блоке.'],\n      ['Снижение цены нефти', 'Низкая', '±8,9 млрд руб. на 10 $', 'Режим НДД, поэтапное решение по второму этапу при цене ниже 55 $/барр.']\n    ];\n    const lv = { 'Высокая': ['oklch(0.94 0.05 25)', 'oklch(0.5 0.17 25)'], 'Средняя': ['oklch(0.95 0.05 75)', 'oklch(0.5 0.12 70)'], 'Низкая': ['oklch(0.95 0.04 150)', 'oklch(0.45 0.12 150)'] };\n    return {\n      prod, prodLeave: () => this.setState({ hov: null }),\n      prodLabel: hp ? 'Добыча в ' + hp.y + ' г.' : 'Пиковая добыча',\n      prodValue: (hp ? f1(hp.v) : '3,2') + ' млн т',\n      capex: [['Бурение скважин', 41.2, '#1d1d1b'], ['Обустройство и УПН', 22.6, '#c2571c'], ['Трубопровод и энергетика', 14.8, '#8a8a84'], ['ГРР и прочее', 7.8, '#cfcfca']]\n        .map(([n, v, col]) => ({ name: n, v: f1(v) + ' млрд', w: (v / 41.2 * 100).toFixed(1), color: col })),\n      scen: Object.entries(SC).map(([k, v]) => ({ label: v.label, bg: s.sc === k ? '#fff' : 'transparent', color: s.sc === k ? '#1d1d1b' : '#b8b8b2', onClick: () => this.setState({ sc: k }) })),\n      kpis: [\n        { label: 'NPV₁₀', value: f(npv), sub: 'млн руб.' },\n        { label: 'IRR', value: f1(irr) + '%', sub: 'барьер компании — 12%' },\n        { label: 'Окупаемость', value: f1(pb), sub: 'лет с начала инвестиций' },\n        { label: 'Цена нефти', value: c.price + ' $', sub: 'за баррель Urals' }\n      ],\n      capexD: d, capexLabel: '+' + d + '%',\n      onCapex: e => this.setState({ capexD: +e.target.value }),\n      capexNote: npv > 0 ? (irr >= 12 ? 'Проект выше барьерной ставки' : 'IRR ниже барьера 12%') : 'Проект убыточен',\n      risks: R.map(([n, l, im, a], i) => ({ name: n, lvl: l, impact: im, action: a, lvlBg: lv[l][0], lvlFg: lv[l][1], open: !!s.open[i], sign: s.open[i] ? '−' : '+',\n        toggle: () => this.setState(st => ({ open: { ...st.open, [i]: !st.open[i] } })) })),\n      road: [['12.2026', 'FID', 'Решение комитета, старт закупок'], ['Q2 2027', 'Бурение', 'Мобилизация 4 буровых станков'], ['Q4 2028', 'Инфраструктура', 'Ввод УПН и напорного нефтепровода'], ['Q1 2029', 'Первая нефть', 'Запуск 38 скважин первой очереди'], ['2030', 'Выход на полку', '3,2 млн т в год']]\n        .map(([dt, t, tx], i) => ({ date: dt, title: t, text: tx, dot: i === 0 ? '#c2571c' : '#1d1d1b' }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
